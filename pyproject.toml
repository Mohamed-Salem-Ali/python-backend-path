[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Exercise files carry long explanatory comments for the learner.
"**/exercises.py" = ["F401", "E501"]
# Project starters import what the learner will need once the TODOs are filled in.
"python/week-*-project/*.py" = ["F401"]
# The testing exercise starts as placeholders: its imports are used once you write the tests.
"python/13-testing/test_payments.py" = ["F401", "E501"]
